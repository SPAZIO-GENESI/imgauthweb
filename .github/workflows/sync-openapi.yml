# P29 FASE 1: la Swagger UI statica su /docs/ legge una copia locale di
# openapi.json (zero chiamate passive al Worker; "Try it out" chiama
# imgauth solo quando l'utente lo usa davvero, perché lo spec dichiara
# "servers": ["https://imgauth.spaziogenesi.org"]).
#
# Il contratto cambia solo ai rilasci imgauth: la finestra settimanale
# basta come rete di sicurezza; a un rilascio che tocca il contratto,
# lanciare questo workflow a mano (workflow_dispatch) — annotato nella
# checklist di rilascio in DEVOPS.md.

name: Sync openapi.json da imgauth

on:
  schedule:
    - cron: "17 4 * * 1" # ogni lunedì alle 04:17 UTC
  workflow_dispatch: {}

# Minima per default; il write (necessario al passo "Commit se cambiato")
# vive a livello di job, non di workflow. Scorecard/A3-parte4.
permissions:
  contents: read

jobs:
  sync:
    runs-on: ubuntu-latest
    permissions:
      contents: write # serve al passo "Commit se cambiato" per pushare col GITHUB_TOKEN di default
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Scarica openapi.json dal repo pubblico imgauth (raw GitHub)
        run: |
          set -e
          curl -fsSL "https://raw.githubusercontent.com/SPAZIO-GENESI/imgauth/main/openapi.json" -o docs/openapi.json.new
          # Validazione minima: dev'essere JSON e avere il campo "openapi".
          # (require() sceglie il parser dall'estensione del file: ".new" non è ".json",
          # quindi proverebbe a eseguirlo come JS e fallirebbe sempre — leggere+JSON.parse
          # ignora l'estensione).
          node -e "const s=JSON.parse(require('fs').readFileSync('./docs/openapi.json.new','utf8')); if(!s.openapi) throw new Error('campo openapi mancante')"
          mv docs/openapi.json.new docs/openapi.json

      - name: Commit se cambiato
        run: |
          set -e
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          if git diff --quiet -- docs/openapi.json; then
            echo "Nessuna modifica al contratto."
            exit 0
          fi
          git add docs/openapi.json
          git commit -m "docs: sincronizza openapi.json da imgauth"
          git push
